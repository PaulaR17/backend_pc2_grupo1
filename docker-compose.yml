#docker-compose de PC2 + PC1 en una sola maquina (LORCA); requiere los 3 repos hermanos y un .env (ver INSTALACION_LORCA.md)

services:

  #base de datos PostgreSQL, persistente con volumen para no perder datos al reiniciar
  postgres:
    image: postgres:14-alpine
    container_name: pc2_postgres
    environment:
      POSTGRES_DB: pc2_grupo1
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d pc2_grupo1"]
      interval: 5s
      retries: 10

  #backend Laravel + PC1 (Python) en el mismo container, asi `predictions:run` ejecuta PC1 con exec()
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pc2_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pc2_grupo1
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      #secretos siempre desde el .env local (no se sube a git)
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      #drivers de cache/sesion/cola a "file" para no necesitar tablas extras en la BD
      CACHE_DRIVER: file
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      JWT_ALGO: RS512
      JWT_PRIVATE_KEY: file:///var/www/html/storage/certs/jwt-rsa-4096-private.pem
      JWT_PUBLIC_KEY: file:///var/www/html/storage/certs/jwt-rsa-4096-public.pem
      JWT_PASSPHRASE: ""
      #Open Route Service: clave del API de geocoding y rutas
      ORS_API_KEY: ${ORS_API_KEY}
      #PC1 corre en el propio container (Python instalado en el Dockerfile)
      ML_USE_SSH: "false"
      ML_PROJECT_PATH: /opt/pc1
      ML_PYTHON_BIN: /opt/pc1-venv/bin/python
      #PC1 lee estas para conectar a postgres
      PC2_DB_HOST: postgres
      PC2_DB_PORT: 5432
      PC2_DB_NAME: pc2_grupo1
      PC2_DB_USER: root
      PC2_DB_PASSWORD: root
      AEMET_API_KEY: ${AEMET_API_KEY:-}
    volumes:
      #PC1 montado en /opt/pc1 (codigo accesible al backend para ejecutarlo)
      - ../Proyecto-de-Computacion-I:/opt/pc1
      #venv en volumen named para no reinstalar pandas/sklearn en cada recreate
      - pc1_venv:/opt/pc1-venv
    ports:
      - "8000:8000"
    restart: unless-stopped

  #frontend Angular servido por nginx, mapeado a 8080 (cambia a "80:80" si la MV tiene el 80 libre)
  frontend:
    build:
      context: ../frontend/frontend_pc2_grupo1
      dockerfile: Dockerfile
    container_name: pc2_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  pc1_venv:
